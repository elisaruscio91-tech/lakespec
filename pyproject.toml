[project]
name = "lakespec"
version = "0.0.1"
description = "Compile ODCS data contracts and OSI semantic models into pipelines, catalog metadata and agent context."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Elisa Ruscio" }]
keywords = ["odcs", "osi", "data-contract", "semantic-layer", "lakehouse", "iceberg", "mcp"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.0"]
workbook = ["openpyxl>=3.1"]
dev = ["pytest>=8.0", "ruff>=0.6", "jsonschema>=4.0"]

[project.scripts]
lakespec = "lakespec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakespec"]

[tool.ruff]
line-length = 100
